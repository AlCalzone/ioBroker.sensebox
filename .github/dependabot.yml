# Dependabot will run on day 17 of each month at 03:54 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "54 3 17 * *"
    open-pull-requests-limit: 15
    assignees:
      - "AlCalzone"
    versioning-strategy: "increase"
